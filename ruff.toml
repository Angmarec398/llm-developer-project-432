# Линт-контракт проекта.
# Набор правил зафиксирован явно: ruff в requirements-dev не закреплён
# по версии, а набор правил по умолчанию меняется между версиями —
# без этого файла результат `make lint` зависел бы от машины.
#
# BLE001 сознательно не включён: guard-границы (fail-closed детектор
# инъекций, отказ документа при ошибке разбора, деградация эмбеддинга
# в лог) ловят Exception намеренно — см. ADR-0006 и комментарии на
# местах. На этих шести границах стоят пометки `# noqa: BLE001` с
# обоснованием: они безобидны при нашем наборе правил, но страхуют
# внешние раннеры, которые запускают ruff со своими настройками,
# где BLE001 может быть включён.
[lint]
select = ["E4", "E7", "E9", "F"]
